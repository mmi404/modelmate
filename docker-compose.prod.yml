# Production stack. Deployed to the VPS at /opt/modelmate (see docs/DEPLOYMENT.md).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are built by CI and pulled from GHCR; `build:` is kept so the stack can
# also be brought up locally with `docker compose -f docker-compose.prod.yml up --build`.
#
# By default only the frontend and backend are published, on 127.0.0.1 — the
# host's shared Caddy terminates TLS and proxies to them (infra/Caddyfile has the
# site block). Run with `--profile edge` to include a dedicated Caddy instead.

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modelmate}
      POSTGRES_USER: ${POSTGRES_USER:-modelmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelmate}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/mmi404/modelmate-backend:latest}
    build:
      context: ./backend
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modelmate}
      DB_USER: ${POSTGRES_USER:-modelmate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${SITE_URL:-https://modelmate.mmi404.com}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@modelmate.mmi404.com}
      SECURITY_CAPTCHA_ENABLED: ${SECURITY_CAPTCHA_ENABLED:-false}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks: [internal]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mmi404/modelmate-frontend:latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://modelmate.mmi404.com}
    <<: *restart
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://modelmate.mmi404.com}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    <<: *restart
    depends_on: [frontend, backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
