name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/modelmate

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_BASE }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://modelmate.mmi404.com' }}
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_BASE }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/modelmate
            export BACKEND_IMAGE=${{ env.IMAGE_BASE }}-backend:${{ needs.build-push.outputs.sha }}
            export FRONTEND_IMAGE=${{ env.IMAGE_BASE }}-frontend:${{ needs.build-push.outputs.sha }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # Persist the rolled-out tags so a plain `compose up` on the box matches.
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Health gate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/modelmate
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null \
                 && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                echo "healthy"; exit 0
              fi
              sleep 5
            done
            echo "::error::health check failed after deploy"
            docker compose -f docker-compose.prod.yml logs --tail=120 backend frontend || true
            echo "Roll back manually: set BACKEND_IMAGE / FRONTEND_IMAGE in /opt/modelmate/.env"
            echo "to the previous SHA tag and run: docker compose -f docker-compose.prod.yml up -d"
            exit 1
