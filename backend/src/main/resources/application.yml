spring:
  application:
    name: modelmate-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/modelmate}
    username: ${DB_USER:modelmate}
    password: ${DB_PASSWORD:modelmate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

modelmate:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:1440}
  mail:
    from: ${MAIL_FROM:no-reply@modelmate.local}
    enabled: ${MAIL_ENABLED:true}
  security:
    captcha:
      enabled: ${SECURITY_CAPTCHA_ENABLED:false}
      turnstile-secret: ${TURNSTILE_SECRET:}
