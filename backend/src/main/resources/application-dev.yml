spring:
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    com.modelmate: DEBUG
    org.flywaydb: INFO

modelmate:
  jwt:
    # Dev-only. Production has no default: the app refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-thirty-two-bytes-long!!}
