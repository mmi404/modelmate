# Local development infrastructure only.
# App services (frontend/backend) run on the host during dev; see README.
# Production stack lives in docker-compose.prod.yml (Phase 8).

services:
  postgres:
    image: postgres:16-alpine
    container_name: modelmate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modelmate}
      POSTGRES_USER: ${POSTGRES_USER:-modelmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelmate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: modelmate-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  mailhog:
    image: mailhog/mailhog:latest
    container_name: modelmate-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  pgdata:
